name: Deploy Function QC

on:
  push:
    branches: [main]
    paths:
      - 'aula03/function/**'

permissions:
  id-token: write
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de dev
        run: pip install ruff pytest

      - name: Lint com ruff
        run: ruff check aula03/function/

      - name: Rodar testes
        run: pytest tests/ -v

  deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy da Function
        uses: Azure/functions-action@v1
        with:
          app-name: func-qc-p6p9bw
          package: aula03/function
          sku: flexconsumption
          remote-build: true
